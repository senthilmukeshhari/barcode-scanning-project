{% extends "unfold/change_list.html" %}

{% block content %}
    <style>
        .chart-container {
            display: flex;
            flex-direction: column;
            gap: 20px;
            margin: 10px 0;
        }
        
        .chart-row {
            display: flex;
            justify-content: space-between;
            gap: 20px;
        }
        
        .chart-box {
            flex: 1;
            min-width: 45%;
            background: #fff;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0px 4px 8px rgba(0, 0, 0, 0.1);
            border: 1px solid grey;
            margin-bottom: 20px;
        }
        
        canvas {
            width: 100%;
            height: 300px !important;
        }
    </style>

    <div class="chart-container">
        <div class="chart-row">
            {% if daily_labels and daily_data %}
                <div class="chart-box">
                    <div>
                        <canvas id="labHoursChart"></canvas>
                    </div>
                </div>
                <script>
                    document.addEventListener("DOMContentLoaded", function() {
                        var ctx = document.getElementById("labHoursChart").getContext("2d");
                        var chart = new Chart(ctx, {
                            type: "bar",
                            data: {
                                labels: {{ daily_labels|safe }},
                                datasets: [{
                                    label: "Total Visit Lab per Day",
                                    data: {{ daily_data|safe }},
                                    backgroundColor: "rgba(54, 162, 235, 0.6)",
                                    borderColor: "rgba(54, 162, 235, 1)",
                                    borderWidth: 1
                                }]
                            },
                            options: {
                                responsive: true,
                                maintainAspectRatio: false,
                                scales: {
                                    y: {
                                    beginAtZero: true,
                                    title: {
                                        display: true,
                                        text: 'Total Visit Lab per Day'
                                    }
                                    },
                                    x: {
                                    title: {
                                        display: true,
                                        text: 'Days of the Week'
                                    }
                                    }
                                },
                                plugins: {
                                    title: {
                                    display: true,
                                    text: 'Total Students Visit Lab per Day (Current Week)'
                                    }
                                }
                            }
                        });
                    });
                </script>
            {% endif %}
            
            {% if student_labels and student_data %}


                <div class="chart-box">
                    <div>
                        <canvas id="totalLabHoursChart"></canvas>
                    </div>
                </div>
                
                <script>
                    document.addEventListener("DOMContentLoaded", function() {
                    var ctx = document.getElementById("totalLabHoursChart").getContext("2d");
                    new Chart(ctx, {
                        type: 'bar',  // Using bar chart
                        data: {
                            labels: {{ student_labels|safe }},  // X-axis: days of the week
                            datasets: {{ student_data|safe }} // Multiple datasets: one per student
                        },
                        options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        scales: {
                            y: {
                            beginAtZero: true,
                            title: {
                                display: true,
                                text: 'Total Lab Hours'
                            }
                            },
                            x: {
                            title: {
                                display: true,
                                text: 'Day'
                            }
                            }
                        },
                        plugins: {
                            title: {
                            display: true,
                            text: 'Total Lab Hours per Student per Day (Current Week)'
                            }
                        }
                        }
                    });
                    });
                </script>
            {% endif %}
        </div>
        
    </div>
{{ block.super }}


    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
{% endblock %}
